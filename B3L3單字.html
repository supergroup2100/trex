<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>單字島｜Lesson 3</title>
<style>
:root{--bg:#f4f1ea;--fg:#222;--card:#fff;--bd:#d9d4c7;--ac:#2a7de1;--ok:#1e9e55;--bad:#d64545;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181d;--fg:#eee;--card:#222831;--bd:#3a414c;--ac:#5aa2ff}}
:root[data-theme="dark"]{--bg:#15181d;--fg:#eee;--card:#222831;--bd:#3a414c;--ac:#5aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;max-width:720px;margin:auto}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;flex-wrap:wrap}
h1{font-size:18px;margin:0}.pill{background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:3px 10px;font-size:14px}
#cv{width:100%;display:block;image-rendering:pixelated;touch-action:none;border-top:2px solid var(--bd);border-bottom:2px solid var(--bd)}
#bar{padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
.big{background:var(--ac);color:#fff;border:0;font-weight:700;padding:10px 16px;margin:6px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:10px;z-index:9}
.box{background:var(--bg);color:var(--fg);border-radius:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:14px;position:relative}
.x{position:absolute;right:8px;top:8px;padding:2px 9px}
.w{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:6px 0}
.w b{font-size:18px}.s{font-size:14px;opacity:.85;margin-top:4px}.sp{padding:2px 8px;margin-right:6px}
.opts{display:grid;gap:8px;margin:8px 0}.opt{text-align:left;padding:10px}.q{font-size:18px;margin:10px 0}
input{font:inherit;font-size:20px;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:2px solid var(--bd);background:var(--card);color:var(--fg);margin:8px 0}
.ok{color:var(--ok);font-weight:700}.no{color:var(--bad);font-weight:700}.top{font-size:13px;opacity:.7}
</style></head><body>
<header><h1>🏝️ 單字島 Lesson 3</h1><span><span class="pill" id="st">🏅 0/4</span> <span class="pill" id="cr">👑 未挑戰</span></span><span><span class="pill" id="who"></span> <button id="sw">換人</button> <button id="clr">🗑 清除我的資料</button></span></header>
<canvas id="cv"></canvas>
<div id="bar"><span id="hint">方向鍵／WASD 走路，或點地圖走過去</span><button class="big" id="go" style="display:none"></button></div>
<div id="modal"><div class="box" id="box"></div></div>
<script>
const KEY='wordIslandL3';
const W=`chicken|n. 雞；雞肉|Mr. Jones keeps some chickens for their eggs.
ant|n. 螞蟻|There are many ants around the sugar.
ugly|adj. 醜陋的|Many people don’t buy ugly fruits. In fact, they are delicious.
duck|n. 鴨子|They’re from the ducks in the pond.
goose|n. 鵝（複數為 geese）|Are they ducks? No, they are geese.
frog|n. 青蛙|A frog usually lives near water and moves by jumping.
cow|n. 母牛|The farmer has twenty cows and thirty pigs on his farm.
map|n. 地圖|Nancy is bad at reading maps. She can’t find her ways often.
beginning|n. 開頭|In the beginning, I didn’t like Calvin. But now, we are good friends.
middle|n. 中間；adj. 中間的|There is a big round table in the middle of the dining room.
quarter|n. 十五分鐘；四分之一|It’s a quarter to twelve. Let’s meet 15 minutes later and have lunch together.
along|prep. 沿著|Jamie takes a walk along the river after dinner every day.
clear|adj. 晴朗的；清楚的|The weather is warm, and the sky is clear.
pass|v. 經過；通過|Pearl said hi when she passed our house.
forest|n. 森林|There are a lot of trees in the forest. The air there is very clean.
dry|adj. 乾燥的；v. （使）變乾|The weather is dry in Sydney in winter. They don’t have much rain.
something|pron. 某物；某事|There must be something wrong with the air con. It’s really hot here.
jar|n. 罐子|Help me put the rice into the jar.
beak|n. 鳥嘴|Birds use their beaks to pick up food.
reach|v. 達到；伸出手臂（拿）|Tony reached into his bag and took out his cellphone.
rock|n. 岩石；v. 搖動|You can see many rocks at the beach.
fly|v. 飛行；駕駛（飛機）（過去式 flew）|The poor bird couldn’t fly because it was hurt.
pick up|撿起|Kelly picked up the clothes on the floor.
back|adv. 回原處；n./adj. 後面（的）|Rebecca went back to her room and took a rest.
drop|v. 丟下；落下|Andy dropped his keys on the bus on his way home.
into|prep. 到……裡面；進入|Don’t go into my room, please.
Good job|做得好！|Sean: My team won the baseball game today. Mom: Good job!
be proud of|以……為榮|We are proud of the players on the school team.
back and forth|來回地|Jay walked back and forth in his room.
finally|adv. 最後|After five months, Robin finally found a job.
top|n. 頂端；adj. 最好的|The school is on the top of the mountain.
past|prep. 經過；n. 過去|Our cat ran past me and out of the room.
finish|v. 完成；結束|Joe took a rest after he finished lunch.
anything|pron. 任何事物|Is there anything special about the story?
shout|v. 喊叫|Never shout at your parents and teachers.
joy|n. 喜悅|Rosa loves exercise. She finds joy in playing sports.
pool|n. 水池；游泳池|Daisy bought a house with a pool. She can swim in her house.
when|conj. 當……時|Dad was cooking dinner when I opened the door.
close|adv. 接近地|Jodie is standing close to me in the photo.`.split('\n').map(l=>{const[en,zh,s]=l.split('|');return{en,zh,s,pos:(/^[a-z]+\./.exec(zh)||['x'])[0]}});
const P=[{n:'農場',r:[0,10],e:'🐄',x:2,y:2,c:'#c0392b'},{n:'森林小屋',r:[10,18],e:'🌲',x:15,y:2,c:'#27ae60'},{n:'海岸',r:[18,29],e:'🪨',x:2,y:8,c:'#2980b9'},{n:'山頂',r:[29,39],e:'⛰️',x:15,y:8,c:'#8e44ad'}];
const TW={n:'拼字高塔',e:'🗼',x:9,y:4,w:2,h:3,c:'#f39c12'};
P.forEach(p=>{p.w=3;p.h=2});
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const norm=s=>s.toLowerCase().replace(/[!.,?]/g,'').replace(/\s+/g,' ').trim();
let save={st:[0,0,0,0],crown:0,best:0},who='';
const RK=KEY+':roster',PK=KEY+':p:';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function roster(){try{const r=JSON.parse(localStorage.getItem(RK)||'[]');return Array.isArray(r)?r:[]}catch(e){return[]}}
function setRoster(r){try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}}
function readP(n){const d={st:[0,0,0,0],crown:0,best:0};try{Object.assign(d,JSON.parse(localStorage.getItem(PK+n)||'{}'))}catch(e){}return d}
function persist(){if(!who)return;try{localStorage.setItem(PK+who,JSON.stringify(save))}catch(e){}}
let warned=0;
function speak(t){try{if(!window.speechSynthesis){if(!warned++)alert('這個瀏覽器不支援語音朗讀，請改用 Chrome 或 Safari。');return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function hud(){const n=save.st.filter(Boolean).length;$('#st').textContent='🏅 '+n+'/4';$('#cr').textContent=save.crown?'👑 已獲得':'👑 未挑戰';$('#who').textContent='👤 '+who}
/* ---------- modal ---------- */
let isOpen=false;
function M(h){isOpen=true;$('#modal').style.display='flex';$('#box').innerHTML='<button class="x" id="xx">✕</button>'+h}
function closeM(){isOpen=false;$('#modal').style.display='none';window.speechSynthesis&&speechSynthesis.cancel();hud()}
$('#box').addEventListener('click',e=>{if(e.target.id==='xx'&&who)closeM();const t=e.target.closest('[data-t]');if(t)speak(t.dataset.t)});
/* ---------- questions ---------- */
function distract(w){const o=W.filter(x=>x!==w);return sh([...sh(o.filter(x=>x.pos===w.pos)),...sh(o.filter(x=>x.pos!==w.pos))]).slice(0,3)}
function mc(w,key){const opts=sh([w,...distract(w)]);return{o:opts.map(x=>x[key]),c:opts.indexOf(w),r:w[key]}}
const qListen=w=>({p:'🔊 聽聽看，這個字是什麼意思？',a:w.en,w,...mc(w,'zh')});
const qZh2En=w=>({p:`<b>${w.zh}</b> 的英文是？`,w,...mc(w,'en')});
const qSpell=w=>({p:`✍️ 聽音拼字：<b>${w.zh}</b>`,a:w.en,t:1,r:w.en,w,sec:'拼字練習'});
const qEn2Zh=w=>({p:`<b style="font-size:24px">${w.en}</b><br>這個字的中文是？`,a:w.en,w,...mc(w,'zh'),sec:'英翻中'});
const qZh2EnT=w=>({p:`中翻英：<b>${w.zh}</b><br>提示：<span style="letter-spacing:2px">${[...w.en].map((c,i)=>c===' '?'／':i?'＿':c).join(' ')}</span>`,t:1,r:w.en,w,sec:'中翻英'});
const okTyped=(q,v)=>{v=norm(v);const a=norm(q.w.en);return v===a||(a==='fly'&&v==='flew')};
function runQ(qs,title,done){let i=0,ok=0,bad=[];
 function show(){const q=qs[i];
  M(`<div class="top">${q.sec||title} ・ ${i+1}/${qs.length}</div><div class="q">${q.p}</div>${q.a?`<button data-t="${q.a}">🔊 再聽一次</button>`:''}`+
   (q.t?`<input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入英文"><button class="big" id="ck">檢查</button>`:`<div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`)+'<div id="fb"></div>');
  if(q.a)speak(q.a);
  const fin=good=>{$('#box').querySelectorAll('.opt,#ck,#in').forEach(b=>b.disabled=true);if(good)ok++;else bad.push(q.w);
   $('#fb').innerHTML=(good?'<div class="ok">✅ 答對了！</div>':`<div class="no">❌ 正確答案：${q.r}</div>`)+`<div class="s">${q.w.en}｜${q.w.zh}<br>${q.w.s}</div><button class="big" id="nx">${i+1<qs.length?'下一題':'看結果'}</button>`;
   if(!q.a||!good)speak(q.w.en);$('#nx').onclick=()=>{i++;i<qs.length?show():done(ok,bad,qs.length)}};
  if(q.t){const inp=$('#in');inp.focus();const go=()=>{if(inp.value.trim())fin(okTyped(q,inp.value))};$('#ck').onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()}}
  else $('#box').querySelectorAll('.opt').forEach(b=>b.onclick=()=>fin(+b.dataset.k===q.c));
 }show()}
/* ---------- places ---------- */
function openPlace(i){const p=P[i],ws=W.slice(...p.r);
 M(`<h2 style="margin:0 24px 6px 0">${p.e} ${p.n}（單字 ${p.r[0]+1}–${p.r[1]}）</h2><div class="top">先按 🔊 聽發音，再挑戰蓋章測驗（5 題，答對 4 題就蓋章）</div>`+
  ws.map(w=>`<div class="w"><button class="sp" data-t="${w.en}">🔊</button><b>${w.en}</b> <span>${w.zh}</span><div class="s"><button class="sp" data-t="${w.s}">🔉</button>${w.s}</div></div>`).join('')+
  `<button class="big" id="qz">📝 開始蓋章測驗</button>`);
 $('#qz').onclick=()=>{const t=sh(ws).slice(0,5);const qs=t.map((w,k)=>k%2?qZh2En(w):qListen(w));
  runQ(qs,p.n+' 蓋章測驗',(ok,bad,n)=>{const pass=ok>=4;if(pass){save.st[i]=1;persist()}
   M(`<h2>${pass?'🏅 蓋章成功！':'再加油一下'}</h2><p>答對 ${ok}/${n} 題。</p>${bad.length?'<p>要再複習：</p>'+bad.map(w=>`<div class="w"><button class="sp" data-t="${w.en}">🔊</button><b>${w.en}</b> ${w.zh}</div>`).join(''):''}<button class="big" id="b1">${pass?'回地圖':'再看一次單字'}</button>`);
   $('#b1').onclick=()=>pass?closeM():openPlace(i)})}}
function openTower(){
 if(save.st.filter(Boolean).length<4){M(`<h2>🗼 拼字高塔</h2><p>🔒 要先在四個地點都蓋到章，才能挑戰高塔。<br>目前 ${save.st.filter(Boolean).length}/4。</p><button class="big" onclick="closeM()">好，我去逛逛</button>`);return}
 M(`<h2>🗼 拼字高塔</h2><p>最終挑戰共 18 題，不能偷看單字表：<br>① 聽音拼字 6 題　② 英翻中 6 題　③ 中翻英（打字）6 題<br>答對 14 題以上，獲得 👑。</p><button class="big" id="bs">開始挑戰</button>`);
 $('#bs').onclick=()=>{const s=sh(W);const qs=[...s.slice(0,6).map(qSpell),...s.slice(6,12).map(qEn2Zh),...s.slice(12,18).map(qZh2EnT)];
  runQ(qs,'高塔挑戰',(ok,bad,n)=>{const pass=ok>=14;save.best=Math.max(save.best||0,ok);if(pass)save.crown=1;persist()
   M(`<h2>${pass?'👑 挑戰成功！':'差一點點！'}</h2><p>答對 ${ok}/${n} 題。${pass?'':'需要 14 題以上。'}</p>${bad.length?'<p>錯的單字：</p>'+bad.map(w=>`<div class="w"><button class="sp" data-t="${w.en}">🔊</button><b>${w.en}</b> ${w.zh}</div>`).join(''):''}<button class="big" id="b2">${pass?'回地圖':'再挑戰一次'}</button>`);
   $('#b2').onclick=()=>pass?closeM():openTower()})}}
/* ---------- map ---------- */
const cv=$('#cv'),g=cv.getContext('2d'),T=32,MW=20,MH=13;cv.width=MW*T;cv.height=MH*T;
const B=[...P,TW];const door=b=>({x:b.x+b.w/2,y:b.y+b.h+.5});
const me={x:10,y:10.5};let tgt=null;const keys={};
function blocked(x,y){if(x<1.2||y<1.2||x>MW-1.2||y>MH-1.2)return 1;return B.some(b=>x>b.x-.25&&x<b.x+b.w+.25&&y>b.y+.4-.25&&y<b.y+b.h+.1)}
function nearest(){let best=null,d0=1.5;B.forEach((b,i)=>{const d=door(b),dd=Math.hypot(me.x-d.x,me.y-d.y);if(dd<d0){d0=dd;best=i}});return best}
function enter(i){if(i==null)return;i<4?openPlace(i):openTower()}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(isOpen){if(k==='escape'&&who)closeM();return}
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=1;tgt=null;if(k==='e')enter(nearest())});
addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);
function tap(e){if(isOpen)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*MW,y=(e.clientY-r.top)/r.height*MH;
 const b=B.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);tgt=b?door(b):{x,y}}
cv.addEventListener('pointerdown',tap);
$('#go').onclick=()=>enter(nearest());
let last=0;
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;
 if(!isOpen){let vx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),vy=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(!vx&&!vy&&tgt){const dx=tgt.x-me.x,dy=tgt.y-me.y,d=Math.hypot(dx,dy);if(d<.15)tgt=null;else{vx=dx/d;vy=dy/d}}
  const l=Math.hypot(vx,vy);if(l){vx/=l;vy/=l;const nx=me.x+vx*4*dt,ny=me.y+vy*4*dt;if(!blocked(nx,me.y))me.x=nx;else if(tgt)tgt=null;if(!blocked(me.x,ny))me.y=ny;else if(tgt&&!blocked(nx,me.y)===false)tgt=null}}
 draw(t);const n=nearest(),bt=$('#go');
 if(n!=null&&!isOpen){bt.style.display='';bt.textContent='進入：'+B[n].n+'（按 E）'}else bt.style.display='none';
 requestAnimationFrame(frame)}
function draw(t){
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const edge=x<1||y<1||x>=MW-1||y>=MH-1,sand=x==1||y==1||x==MW-2||y==MH-2;
  g.fillStyle=edge?((x+y+Math.floor(t/600))%2?'#3b8ed0':'#4a9ae0'):sand?'#ecdcA0':((x+y)%2?'#7ec850':'#76c04a');g.fillRect(x*T,y*T,T,T)}
 B.forEach((b,i)=>{const done=i<4?save.st[i]:save.crown,w=b.w*T,h=b.h*T,x=b.x*T,y=b.y*T;
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+4,y+h-2,w,8);
  g.fillStyle=b.c;g.fillRect(x,y+.6*T,w,h-.6*T);g.fillStyle='#4a2f22';g.fillRect(x-4,y,w+8,.7*T);
  g.fillStyle='#2b1a12';g.fillRect(x+w/2-10,y+h-26,20,26);
  g.font='26px serif';g.textAlign='center';g.textBaseline='middle';g.fillText(b.e,x+w/2,y+h*.45);
  g.font='bold 12px sans-serif';g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.7)';g.lineWidth=3;
  const lab=b.n+(done?' ✅':(i==4&&save.st.filter(Boolean).length<4?' 🔒':''));g.strokeText(lab,x+w/2,y-8);g.fillText(lab,x+w/2,y-8)});
 const n=nearest();if(n!=null){const d=door(B[n]);g.strokeStyle='#ffd400';g.lineWidth=3;g.beginPath();g.arc(d.x*T,(d.y-.5)*T,16+Math.sin(t/200)*2,0,7);g.stroke()}
 g.font='26px serif';g.fillStyle='#000';g.fillText('🧒',me.x*T,me.y*T-8+Math.sin(t/150)*(tgt||Object.keys(keys).length?2:0))}
hud();requestAnimationFrame(frame);
function login(){const r=roster();
 M(`<h2>🏝️ 歡迎來到單字島</h2><p>輸入名字就能開始，每個人的蓋章和成績分開存。走到建築門口先聽單字，再做測驗蓋章；集滿 4 個章就能挑戰 🗼 拼字高塔。🔊 請把音量打開。</p><input id="nm" maxlength="12" placeholder="你的名字" autocomplete="off"><button class="big" id="st1">開始</button>`+
  (r.length?`<div class="top">這台裝置上的同學（點名字繼續）</div>`+r.map((n,i)=>{const p=readP(n);return `<div class="w"><button data-pl="${i}">${esc(n)}</button> 🏅${p.st.filter(Boolean).length}/4 ${p.crown?'👑':''} ${p.best?'塔 '+p.best+'/18':''} <button class="sp" data-del="${i}">🗑 刪除</button></div>`}).join('')+`<button id="clrall">🗑 清除這台裝置上所有同學的資料</button>`:'')+
  `<div class="top" style="margin-top:8px">資料只存在這台裝置的瀏覽器裡，不會上傳；換裝置或清除瀏覽器資料後會不見。</div>`);
 $('#xx').style.display='none';
 const start=n=>{n=n.trim();if(!n)return;const rr=roster();if(!rr.includes(n)){rr.push(n);setRoster(rr)}who=n;save=readP(n);me.x=10;me.y=10.5;tgt=null;persist();closeM()};
 $('#st1').onclick=()=>start($('#nm').value);$('#nm').onkeydown=e=>{if(e.key==='Enter')start($('#nm').value)};
 $('#box').querySelectorAll('[data-pl]').forEach(b=>b.onclick=()=>start(roster()[+b.dataset.pl]));
 $('#box').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const rr=roster(),n=rr[+b.dataset.del];if(n&&confirm('要刪除「'+n+'」的名字和全部成績嗎？不能復原。')){try{localStorage.removeItem(PK+n)}catch(e){}rr.splice(+b.dataset.del,1);setRoster(rr);login()}});
